<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeVoice</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1b1d21; --muted: #5f6672; --line: #e3e6eb;
      --accent: #2f6bff; --off: #b8bec9; --err-bg: #fdecec; --err-fg: #a31b1b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1d21; --fg: #f1f3f6; --muted: #a0a7b4; --line: #2e323a;
        --accent: #6b95ff; --off: #4a505c; --err-bg: #3a1f1f; --err-fg: #ff9b9b;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 300px; margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 16px; font-weight: 600; }
    #settings { color: var(--muted); font-size: 12px; text-decoration: none; }
    #settings:hover, #settings:focus-visible { color: var(--fg); text-decoration: underline; }
    .row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-top: 16px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    }
    #label { font-weight: 600; }
    #state { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    #toggle {
      flex: none; position: relative; width: 52px; height: 30px; padding: 0; border: 0;
      border-radius: 15px; background: var(--off); cursor: pointer; transition: background .15s;
    }
    #toggle::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
      border-radius: 50%; background: #fff; transition: transform .15s;
    }
    #toggle[aria-checked="true"] { background: var(--accent); }
    #toggle[aria-checked="true"]::after { transform: translateX(22px); }
    #toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #toggle:disabled { opacity: .5; cursor: progress; }
    #error {
      margin: 12px 0 0; padding: 8px 10px; border-radius: 6px;
      background: var(--err-bg); color: var(--err-fg); font-size: 12px;
    }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { #toggle, #toggle::after { transition: none; } }
  </style>
</head>
<body>
  <header>
    <h1>DeVoice</h1>
    <a id="settings" href="#">Settings</a>
  </header>
  <div class="row">
    <div>
      <div id="label">Remove vocals</div>
      <p id="state" role="status" aria-live="polite">Checking…</p>
    </div>
    <button id="toggle" type="button" role="switch" aria-checked="false" aria-labelledby="label" disabled></button>
  </div>
  <p id="error" role="alert" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
