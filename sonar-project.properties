sonar.projectKey=YuvalShaffir_DeVoice
sonar.organization=yuvalshaffir


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=DeVoice
sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=backend,extension
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
# Entry point: wiring only (real model, real token file); covered by running the server, not unit tests
sonar.coverage.exclusions=backend/main.py

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
