[project]
name = "devoice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "demucs>=4.0.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
addopts = "-m 'not slow'"
markers = ["slow: loads the real Demucs model (run with -m slow)"]

[tool.coverage.run]
include = ["backend/*"]
relative_files = true
